# /etc/nginx/sites-available/camp.offline-tambov.ru
#
# ASCII ONLY. This is the one file in the project with English comments:
# certbot's --nginx plugin parses every nginx config file, and Cyrillic
# here crashes it with UnicodeDecodeError. That would also break
# `certbot renew` in 90 days, silently. Explanations in Russian live in
# deploy/README.md instead.
#
# No TLS here on purpose. Declaring `listen 443 ssl` before a certificate
# exists makes `nginx -t` fail, and certbot runs `nginx -t` before doing
# anything -- so it refuses to start. Chicken and egg. certbot adds the
# 443 listener, ssl_certificate and the port 80 redirect by itself and
# keeps everything below.
#
#   certbot --nginx -d camp.offline-tambov.ru

# limit_req_zone belongs in the http context; sites-enabled is included
# from inside http {} in the main nginx.conf, so this is legal here.
#
# First layer against request floods. The second one is the counter inside
# server.mjs (30/min): nginx counts by connection address, Node counts by
# X-Real-IP, and those differ the day a second proxy appears.
limit_req_zone $binary_remote_addr zone=camp_post:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=camp_get:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name camp.offline-tambov.ru;

    # `http2 on` replaces the deprecated `listen ... http2` (nginx 1.25+).
    # Takes effect on 443 once certbot adds it.
    http2 on;

    # X-Real-IP matters: without it every address collapses into a single
    # 127.0.0.1 inside server.mjs, and the first participant would burn
    # the rate limit for everyone.
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host              $host;
    proxy_http_version 1.1;

    # The page is entirely self-contained: no external script, font or
    # image, so default-src 'self' does not break it. 'unsafe-inline' is
    # required -- the landing page is one file with its own <style> and
    # <script> blocks inside.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 8k;          # /signup posts a couple of JSON lines

    # Safety net in case CAMP_PUBLIC is ever forgotten: these paths stay
    # out of the internet even then. Deliberately duplicates the allowlist
    # in server.mjs -- the boundary must hold through one misconfiguration.
    # Regex locations are matched before prefix ones but after exact (=),
    # so /signup and /me below are not shadowed.
    #
    # admin.html and reception.html are NOT in this list any more. They used
    # to be, back when the panels lived behind auth_basic on their own ports.
    # Now the login is server-side (see auth.mjs) and both pages are served
    # from the one port, gated by the session cookie -- a blanket 404 here
    # would make them unreachable for everyone.
    #
    # Dropping them is safe because these two files hold no data: markup and
    # script only. What holds data is below and stays blocked -- the mirrors
    # of the database, the participant cards, the bot tokens and the history.
    location ~ ^/(users|participants|signups|integrations|camp|outbox)\.json$ { return 404; }
    location ~ \.(mjs|bak|command)$                                { return 404; }
    location ^~ /backups/                                          { return 404; }

    # ---- One door ------------------------------------------------------
    #
    # There used to be two: /admin/ on port 8001 and /reseption/ on port
    # 8002, each behind its own auth_basic file. The role was the port, and
    # the port was reached by knowing one of two passwords.
    #
    # That is gone, and the reason is worth writing down, because the old
    # scheme was not wrong -- it was structurally unable to do what was
    # asked. auth_basic runs BEFORE a single byte of any page is served. So
    # the password chose the role before a login page could even load, and
    # "one entry page that works out your role and sends you where you
    # belong" cannot exist above it. The password WAS the role.
    #
    # So the order is inverted: the login moved into server.mjs (auth.mjs).
    # First you say who you are (Supabase Auth), then the server reads your
    # role from the staff table, and only then does it decide what to serve.
    # Roles are checked per request against a signed HttpOnly cookie, so the
    # separation the two ports gave us is still there -- it just lives one
    # layer down, where it can also cover PUT and /queue, which a password
    # shared by a whole shift never really did.
    #
    # /admin/ and /reseption/ stay as redirects: they are in browser
    # bookmarks and written down on paper at the camp.
    #
    # client_max_body_size must be large here: participants.json grows
    # with the camp and can exceed the 8k limit below.

    # Not a redirect: the door is served AT these addresses. Without a session
    # the server answers with the login page (200), with one -- the panel. The
    # address in the bookmark stays the same before and after logging in.
    # The exact (=) match passes /admin/ through UNCHANGED: the server needs
    # to see that address to decide door-or-panel by the session cookie.
    #
    # These two documents also get their own CSP with 'unsafe-eval': the
    # panels parse the CAMP block and the landing's own check functions out
    # of landing.html with new Function() (camp-ui.js parseCamp, admin.html
    # buildCheck) -- that is eval as far as CSP is concerned, and without
    # this the panel dies with a CSP violation. The public landing page
    # keeps the strict server-wide policy above. NOTE: add_header inside a
    # location DROPS every add_header inherited from the server level, so
    # the other three headers are repeated here on purpose.
    location = /admin/ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        proxy_pass http://127.0.0.1:8000;
    }
    location = /reseption/ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        proxy_pass http://127.0.0.1:8000;
    }

    # Everything BELOW those addresses gets the prefix stripped by the
    # trailing slash: the panel links its assets relatively (camp-ui.css),
    # so at /admin/ they resolve to /admin/camp-ui.css and must arrive as
    # /camp-ui.css. Access is still decided by the cookie, not by the path.
    location ^~ /admin/     { proxy_pass http://127.0.0.1:8000/; }
    location ^~ /reseption/ { proxy_pass http://127.0.0.1:8000/; }

    # POST /session is the login itself: it trades a Supabase token for the
    # session cookie. Rate-limited like the other POSTs -- it is the one
    # route where guessing has any point at all.
    location = /session {
        limit_req zone=camp_post burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    # ---- The database, under the same address ---------------------------
    #
    # Self-hosted Supabase parts: PostgREST on 3000, GoTrue on 9999. The
    # trailing slash in proxy_pass strips the prefix, so PostgREST sees
    # /staff and GoTrue sees /token -- exactly what the cloud service would
    # have received. Panels and bot therefore talk to their own origin and
    # no CORS setup is needed at all.
    location /rest/v1/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # Rate limit is not optional here: this is the one door into the camp
    # office that faces the internet, and without it guessing is free.
    location /auth/v1/ {
        limit_req zone=camp_post burst=10 nodelay;
        proxy_pass http://127.0.0.1:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Public side ---------------------------------------------------
    location = /signup { limit_req zone=camp_post burst=10 nodelay; proxy_pass http://127.0.0.1:8000; }
    location = /me     { limit_req zone=camp_post burst=10 nodelay; proxy_pass http://127.0.0.1:8000; }

    location / {
        limit_req zone=camp_get burst=60 nodelay;

        # Saving the schedule is now PUT /camp -- about 12 KB of data, not
        # the 310 KB page it used to be: the panel sends the CAMP block and
        # the server splices it into landing.html itself (camp.mjs).
        # PUT /landing.html is gone entirely -- nothing writes the markup
        # over HTTP any more, it goes through git like the rest of the code.
        #
        # The 8m stays for participants.json, which grows with the camp.
        # Without the line it fails with 413, and the /admin/ location that
        # used to carry the limit is gone.
        #
        # This does not loosen the public side: /signup and /me have their
        # own exact locations above and keep the server-wide 8k. And the
        # PUT itself is refused unless the session cookie carries a role
        # allowed to write that file -- see auth.mjs and canWrite().
        client_max_body_size 8m;

        proxy_pass http://127.0.0.1:8000;
    }
}
