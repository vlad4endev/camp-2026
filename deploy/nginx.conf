# /etc/nginx/sites-available/camp.offline-tambov.ru
#
# Конфиг НАМЕРЕННО без TLS: блок на 443 и ssl_certificate дописывает
# certbot сам. Если объявить `listen 443 ssl` заранее, nginx -t упадёт
# на отсутствующем сертификате — а certbot запускает nginx -t перед
# работой и откажется стартовать. Курица и яйцо.
#
#   certbot --nginx -d camp.offline-tambov.ru
#
# После него в этом же server-блоке появятся listen 443 ssl,
# ssl_certificate и редирект с 80. Всё, что ниже, certbot сохранит.

# limit_req_zone живёт в http-контексте: sites-enabled включается внутрь
# http {} из основного nginx.conf, поэтому здесь это законно.
#
# Первый слой защиты от потока запросов. Второй — счётчик внутри
# server.mjs (30/мин): nginx считает по адресу, Node — по X-Real-IP,
# и это разные вещи, если однажды появится второй прокси.
limit_req_zone $binary_remote_addr zone=camp_post:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=camp_get:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name camp.offline-tambov.ru;

    # http2 on вместо устаревшего `listen ... http2` (nginx 1.25+).
    # Подействует на 443 после того, как certbot его добавит.
    http2 on;

    # X-Real-IP: без него все адреса в лимитах server.mjs слипнутся
    # в один 127.0.0.1, и первый же участник исчерпает лимит на всех.
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host              $host;
    proxy_http_version 1.1;

    # Страница целиком своя: ни одного внешнего скрипта, шрифта и картинки,
    # поэтому default-src 'self' её не ломает. 'unsafe-inline' нужен —
    # лендинг это один файл со своими <style> и <script> внутри.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    # HSTS добавляем только после того, как certbot включит TLS —
    # на голом http этот заголовок браузер игнорирует, но и смысла в нём нет.
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 8k;          # /signup присылает пару строк JSON

    # Подстраховка на случай, если CAMP_PUBLIC забыли выставить: даже тогда
    # эти пути не уйдут в интернет. Дублирует белый список в server.mjs
    # намеренно — граница должна держать при одной ошибке в настройке.
    # Регулярные location проверяются раньше префиксных, но позже
    # точных (=), поэтому /signup и /me ниже не перекрываются.
    location ~ ^/(admin|reception)\.html$                          { return 404; }
    location ~ ^/(users|participants|signups|integrations)\.json$  { return 404; }
    location ~ \.(mjs|bak|command)$                                { return 404; }
    location ^~ /backups/                                          { return 404; }

    location = /signup { limit_req zone=camp_post burst=10 nodelay; proxy_pass http://127.0.0.1:8000; }
    location = /me     { limit_req zone=camp_post burst=10 nodelay; proxy_pass http://127.0.0.1:8000; }

    location / {
        limit_req zone=camp_get burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
}
