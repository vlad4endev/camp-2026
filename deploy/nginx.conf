# /etc/nginx/sites-available/camp.offline-tambov.ru
#
# Сертификат ставит certbot (см. deploy/README.md) — он же допишет сюда
# блоки ssl_certificate и редирект с http. Ниже — то, что нужно добавить
# руками сверх этого.

# Лимит на запись: nginx отбивает поток раньше, чем Node начнёт читать
# файлы с диска. Внутри server.mjs есть свой счётчик (30/мин) — это
# второй слой, для случая «nginx пропустил, но запросов всё равно много».
limit_req_zone $binary_remote_addr zone=camp_post:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=camp_get:10m rate=120r/m;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name camp.offline-tambov.ru;

    # ssl_certificate / ssl_certificate_key — впишет certbot

    # X-Real-IP: без него все адреса в лимитах server.mjs слипнутся
    # в один 127.0.0.1, и первый же участник исчерпает лимит на всех.
    proxy_set_header X-Real-IP        $remote_addr;
    proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host             $host;
    proxy_http_version 1.1;

    # Страница целиком своя: ни одного внешнего скрипта, шрифта и картинки,
    # поэтому default-src 'self' её не ломает. 'unsafe-inline' нужен —
    # лендинг это один файл со своими <style> и <script> внутри.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 8k;          # /signup присылает пару строк JSON

    location = /signup { limit_req zone=camp_post burst=10 nodelay; proxy_pass http://127.0.0.1:8000; }
    location = /me     { limit_req zone=camp_post burst=10 nodelay; proxy_pass http://127.0.0.1:8000; }

    location / {
        limit_req zone=camp_get burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    # Подстраховка на случай, если CAMP_PUBLIC забыли выставить: даже тогда
    # эти пути не уйдут в интернет. Дублирует белый список в server.mjs
    # намеренно — граница должна держать при одной ошибке в настройке.
    location ~ ^/(admin|reception)\.html$            { return 404; }
    location ~ ^/(users|participants|signups)\.json$ { return 404; }
    location ~ \.(mjs|bak|command)$                  { return 404; }
    location ^~ /backups/                            { return 404; }
}
