          `<button class="chip" data-act="openperson" data-i="${pi}">${esc(p.name) || 'без имени'}${
            p.room ? ` · ${esc(p.room)}` : ''}</button>`).join('')}</div>
          <p class="hint" style="margin-top:6px">Клик открывает карточку участника.</p>`
        : '<p class="hint">Пока никто не записан.</p>'}
      </div>` : ''}
    </div>
    <div class="df">
      <button class="b-sm" data-act="duptile" data-list="${list}" data-i="${i}">Дублировать</button>
      <button class="b-sm danger" data-act="del" data-list="${list}" data-i="${i}">Удалить</button>
      <span style="flex:1"></span>
      <span class="hint">${i+1} из ${L.length}</span>
      <button class="b-pri" data-act="cardclose">Готово</button>
    </div>`;
}

/* ── ТЕКСТЫ СТРАНИЦЫ ───────────────────────────────────────
   Всё, что раньше было зашито в разметку лендинга. */
const SEC = [['eyebrow','Надзаголовок'],['title','Заголовок'],['sub','Подпись']];
const TEXT_GROUPS = [
  ['',        'Общее', [['title','Заголовок вкладки браузера'],
                        ['description','Описание для поиска и мессенджеров'],
                        ['brand','Название в шапке']]],
  ['board',   'Секция «Объявления»', SEC],
  ['themes',  'Секция «Тематика дней»', SEC],
  ['schedule','Секция «Расписание»', SEC],
  ['classes', 'Секция «Мастер-классы»', SEC],
  ['info',    'Секция «Памятка»', SEC],
  ['help',    'Блок «Спросите организатора»', [...SEC, ['btn','Надпись на кнопке'], ['note','Приписка под кнопкой']]],
  ['footer',  'Подвал', [['logo','Название'],['line','Строка о лагере'],['org','Строка об организаторе']]],
];
function viewTexts(){
  if(!S.camp.texts) return `<h2 class="vt">Тексты страницы</h2>
    <div class="err-box">В этом <code>landing.html</code> ещё нет блока <code>texts</code> —
      значит, заголовки в нём зашиты в разметку и панель их не видит. Обновите файл лендинга.</div>`;
  const long = new Set(['description','sub','note','org','line']);
  return `<h2 class="vt">Тексты страницы</h2>
    <p class="vs">Заголовки секций, подвал и блок помощи.</p>
    ${help('Подстановки и разметка',
      '<code>{tg}</code> — @ник · <code>{tglink}</code> — ссылка на телеграм · ' +
      '<code>{place}</code> — место · <code>{dates}</code> — «25–29 августа 2026», считается само.<br>' +
      'В подписях работают <code>&lt;br&gt;</code> и ссылки <code>&lt;a href="…"&gt;…&lt;/a&gt;</code>.')}` +
    TEXT_GROUPS.map(([g,label,fields]) => `<div class="card"><h3>${label}</h3>` +
      fields.map(([k,fl]) => {
        const path = g ? `texts.${g}.${k}` : `texts.${k}`;
        const val = g ? (S.camp.texts[g] || {})[k] : S.camp.texts[k];
        return long.has(k) ? fArea(path, fl, val, 2) : fInput(path, fl, val);
      }).join('') + `</div>`).join('');
}

/* ── ИНТЕГРАЦИИ ──────────────────────────────────────────────── */
const iState = b => !b.token ? ['g','не заполнено'] : b.on ? ['','включено'] : ['g','выключено'];

function secretField(path, label, val, key, hint){
  const shown = !!S.iShow[key];
  return `<label class="f"><span>${label}</span>
    <div class="row" style="gap:6px;flex-wrap:nowrap">
      <input data-path="${path}" ${shown ? '' : 'type="password"'} value="${esc(val)}"
        autocomplete="off" spellcheck="false" style="flex:1;font-family:ui-monospace,Menlo,monospace;font-size:12.5px">
      <button class="b-sm" data-act="ishow" data-k="${key}" title="${shown ? 'Скрыть' : 'Показать'}">${shown ? 'скрыть' : 'показать'}</button>
      ${val ? `<button class="b-sm" data-act="icopy" data-k="${key}" title="Скопировать">копировать</button>` : ''}
    </div>
    ${hint ? `<p class="hint" style="margin-top:5px">${hint}</p>` : ''}
    ${val && !shown ? `<p class="hint" style="margin-top:4px;font-family:ui-monospace,Menlo,monospace">${esc(mask(val))}</p>` : ''}
  </label>`;
}

function viewIntegr(){
  if(!S.integ) S.integ = INTEG_DEF();
  const t = S.integ.telegram, m = S.integ.max, px = S.integ.proxy;
  const pp = parseProxy(px.url);
  const test = k => { const r = S.iTest[k]; return r
    ? `<p class="hint" style="margin-top:6px;color:${r.ok ? 'var(--acc)' : 'var(--err)'};font-weight:600">${esc(r.msg)}</p>` : ''; };

  return `<h2 class="vt">Интеграции</h2>
    <p class="vs">Токены ботов и прокси. Хранятся в <code>${esc(S.iName)}</code> рядом с панелью.</p>
    ${help('Куда это попадает',
      'Файл лежит рядом с <code>admin.html</code> и в лагерную Wi-Fi не отдаётся: у сервера белый список, ' +
      'всё, чего в нём нет, отвечает 404. Но на диске это обычный текст — у кого есть ноутбук, тот прочитает. ' +
      'Поэтому здесь только то, что не жалко перевыпустить: токен бота отзывается у BotFather за минуту. ' +
      'Пароли людей сюда не кладём никогда.')}

    <div class="card">
      <div class="ch"><h3>Telegram-бот <span class="tag ${iState(t)[0]}">${iState(t)[1]}</span></h3>
        <button class="b-sm" data-act="ion" data-b="telegram">${t.on ? 'выключить' : 'включить'}</button></div>
      ${secretField('integ.telegram.token', 'Токен от @BotFather', t.token, 'tg',
        'Можно вставить всё письмо целиком — токен вытащится сам.')}
      <div class="g2">
        ${fInput('integ.telegram.bot', 'Имя бота (@username)', t.bot)}
        ${fInput('integ.telegram.chat', 'Куда слать (id чата или @канал)', t.chat)}
      </div>
      <div class="row"><button class="b-sm" data-act="icheck" data-b="telegram">Проверить токен</button></div>
      ${test('telegram')}
    </div>

    <div class="card">
      <div class="ch"><h3>MAX-бот <span class="tag ${iState(m)[0]}">${iState(m)[1]}</span></h3>
        <button class="b-sm" data-act="ion" data-b="max">${m.on ? 'выключить' : 'включить'}</button></div>
      ${secretField('integ.max.token', 'Токен бота MAX', m.token, 'max')}
      ${fInput('integ.max.bot', 'Имя бота', m.bot)}
      <p class="hint">Проверки по сети здесь нет: адрес API MAX я не подтверждал, а гадать в кнопке «проверить» —
        хуже, чем её отсутствие. Токен просто сохраняется для бота.</p>
    </div>

    <div class="card">
      <div class="ch"><h3>Прокси для Telegram <span class="tag ${px.url ? (px.on ? '' : 'g') : 'g'}">${
        px.url ? (px.on ? 'включён' : 'выключен') : 'не задан'}</span></h3>
        <button class="b-sm" data-act="ion" data-b="proxy">${px.on ? 'выключить' : 'включить'}</button></div>
      ${fInput('integ.proxy.url', 'Адрес одной строкой', px.url, 'text',
        'placeholder="socks5://user:pass@1.2.3.4:1080"')}
      ${!pp ? '<p class="hint">Пусто — бот пойдёт напрямую.</p>'
        : pp.err ? `<p class="hint" style="color:var(--err);font-weight:600">${esc(pp.err)}</p>`
        : `<div class="rline"><b>${esc(pp.type)}</b> · ${esc(pp.host)} : ${esc(pp.port)}
             <div>${pp.user ? 'логин ' + esc(pp.user) + (pp.pass ? ' · пароль задан' : ' · без пароля') : 'без авторизации'}</div></div>`}
      ${pp && pp.pass ? '<p class="hint">Пароль прокси лежит в файле открыто — как и любой другой ключ здесь.</p>' : ''}
      <p class="hint">Прокси нужен процессу бота, а не этой странице. Кнопка «Проверить токен» выше ходит
        напрямую из браузера — если она молчит, а бот работает, значит дело как раз в прокси.</p>
    </div>`;
}

function viewGeneral(){
  const c = S.camp;
  return `<h2 class="vt">Настройки лагеря</h2>
    <p class="vs">Год и месяц задают, как считаются «сегодня», прошедшее и будущее на странице.</p>
    <div class="card">
      <div class="g2">${fInput('year','Год', c.year, 'number')}${fInput('month','Месяц (1–12)', c.month, 'number', 'min="1" max="12"')}</div>
      ${fInput('place','Место', c.place)}
      ${fInput('tg','Telegram организатора (без @)', c.tg)}
      <p class="hint">Ник подставляется в кнопку помощи, подвал и карточку «Организатор» —
        менять его в разметке больше не нужно.</p>
    </div>
    <div class="card"><h3>Деньги</h3>
      <label class="f"><span>Стоимость участия по умолчанию, ₽</span>
        <input type="number" min="0" step="100" id="defFee" value="${defFee()}"></label>
      <p class="hint">Подставляется новым участникам. У каждого сумму можно поменять
        в раскрытой строке — там же видно долг.</p></div>
    <div class="card"><h3>Файлы</h3>
      <p class="hint mb">Лендинг: <b>${esc(S.name)}</b>${S.hCamp ? ' · пишется напрямую' : ' · сохранится копией'}<br>
        Участники: <b>${S.people ? esc(S.pName) : 'не открыты'}</b>${S.hPeople ? ' · пишется напрямую' : ''}</p>
      <p class="hint mb">Папка: <b>${S.hDir ? esc(S.hDir.name) + ' · бэкапы в backups/' : 'не выбрана — автобэкапов на диск нет'}</b></p>
      <label class="inline" style="margin-bottom:10px"><input type="checkbox" id="defAuto"${S.autosave ? ' checked' : ''}>
        Автосохранение — писать в файл через 2 секунды после правки</label>
      <div class="row">
        <button class="b-sm" data-act="openf">Открыть папку лагеря</button>
        <button class="b-sm" data-act="openc">Другой лендинг</button>
        <button class="b-sm" data-act="openp">Другой список</button>
        <button class="b-sm" data-act="backup">Скачать копии сейчас</button>
      </div></div>`;
}
</script>
<script>
/* ═══════════ 9. УЧАСТНИКИ ════════════════════════════════════ */

/* фильтр и сортировка — это ВИД, а не порядок в файле: работаем
   парами [участник, настоящий индекс], поэтому «удалить» удаляет
   того, кого видно, а не того, кто на этой позиции в JSON */
const col = v => String(v || '').trim() || 'яяяя';
function peopleRows(){
  let rows = S.people.map((p,i) => [p,i]);
  const f = S.filter;
  if(f === '!arrived')      rows = rows.filter(([p]) => p.status !== 'arrived');
  else if(f === '!room')    rows = rows.filter(([p]) => !String(p.room).trim());
  else if(f === '!paid')    rows = rows.filter(([p]) => active(p) && debtOf(p) > 0);
  else if(f.startsWith('st:'))  rows = rows.filter(([p]) => p.status === f.slice(3));
  else if(f.startsWith('role:'))rows = rows.filter(([p]) => p.role === f.slice(5));
  else if(f.startsWith('cls:')) rows = rows.filter(([p]) => p.classes.includes(f.slice(4)));
  const q = S.q.trim().toLowerCase();
  if(q) rows = rows.filter(([p]) =>
    [p.name,p.phone,p.tg,p.room,p.note,ROLE[p.role].l,stOf(p).l,...p.classes].join(' ').toLowerCase().includes(q));
  const cmp = {
    name:    (a,b) => col(a[0].name).localeCompare(col(b[0].name), 'ru'),
    room:    (a,b) => col(a[0].room).localeCompare(col(b[0].room), 'ru', {numeric:true}),
    arrived: (a,b) => (a[0].status === 'arrived' ? 1 : 0) - (b[0].status === 'arrived' ? 1 : 0),
    debt:    (a,b) => debtOf(b[0]) - debtOf(a[0]),
  }[S.sort];
  if(cmp) rows.sort(cmp);
  return rows;
}

const chipHtml = (i,n,on,orphan) =>
  `<label class="chip${on?' on':''}"${orphan?' style="border-color:var(--warn);color:#8A5D00"':''}>
    <input type="checkbox" data-act="cls" data-i="${i}" data-name="${esc(n)}"${on?' checked':''}> ${esc(n)}${orphan?' ⚠':''}</label>`;

/* Строка — только чтение и один быстрый жест (отметить заезд).
   Всё редактирование живёт в карточке: так строка остаётся читаемой,
   а на стойке регистрации не промахиваешься мимо ячейки. */
function rowHtml(p,i){
  const st = stOf(p), fee = Number(p.fee) || 0, paid = paidOf(p), debt = debtOf(p);
  return `<tr class="clk${S.card === i ? ' sel' : ''}" data-act="open" data-i="${i}">
    <td class="mid"><button class="b-sm" data-act="quickstat" data-i="${i}"
      title="${p.status === 'arrived' ? 'Отменить заезд' : 'Отметить заезд'}"
      style="${p.status === 'arrived' ? 'background:var(--acc2);color:#fff;border-color:var(--acc2)' : ''}">✓</button></td>
    <td><div class="who"><span class="sdot" style="background:${st.dot}"></span>
      <b>${esc(p.name) || '<span style="color:var(--mut);font-weight:400">Без имени</span>'}</b>
      ${p.role === 'team' ? '<span class="rl">команда</span>' : ''}
      ${p.note ? '<span title="есть заметка">📝</span>' : ''}</div></td>
    <td class="nrw" style="white-space:nowrap">${esc(p.phone) || '<span class="hint">—</span>'}</td>
    <td>${esc(p.room) || '<span class="hint">—</span>'}</td>
    <td class="mid">${p.classes.length || '<span class="hint">—</span>'}</td>
    <td style="min-width:130px">${fee ? `<div style="font-size:12.5px">${money(paid)}<span class="hint"> / ${money(fee)}</span></div>
        <div class="bar" style="margin:4px 0 0"><i style="width:${Math.min(100, fee ? paid/fee*100 : 0)}%"></i></div>`
      : '<span class="hint">без взноса</span>'}
      ${debt ? `<div style="font-size:11px;color:var(--warn);font-weight:700">долг ${money(debt)}</div>` : ''}</td>
    <td><span class="stag" style="background:${st.bg};color:${st.fg}">${st.l}</span></td>
  </tr>`;
}
function rowsHtml(){
  const rows = peopleRows();
  if(!rows.length) return `<tr><td colspan="7" style="padding:16px"><span class="hint">${
    S.people.length ? 'Никто не найден — снимите фильтр или очистите поиск.'
                    : 'Список пуст. Добавьте участника или вставьте таблицу через «Импорт».'}</span></td></tr>`;
  return rows.map(([p,i]) => rowHtml(p,i)).join('');
}
const repaintRows = () => { const b = $('#pbody'); if(b) b.innerHTML = rowsHtml(); };

/* ── КАРТОЧКА УЧАСТНИКА ─────────────────────────────────────── */
function openDrawer(html){
  const el = $('#card');
  el.className = 'drawer';
  el.innerHTML = html;
  el.hidden = false;
  return el;
}
function openCard(i){
  S.card = i; S.ev = null;
  const el = openDrawer(cardHtml(i));
  repaintRows();
  const n = el.querySelector('[data-path$=".name"]');
  if(n && !S.people[i].name) n.focus();
}
/* одна панель на двоих: открыт может быть только один объект */
function closeCard(){
  S.card = null; S.ev = null; S.ann = null; S.tile = null;
  $('#card').hidden = true; $('#card').innerHTML = '';
  repaintRows(); repaintEvs(); repaintAnn(); repaintTiles();
}
function repaintCard(){ if(S.card != null) openCard(S.card); }

function cardHtml(i){
  const p = S.people[i], st = stOf(p);
  const fee = Number(p.fee) || 0, paid = paidOf(p), debt = debtOf(p);
  const known = S.camp ? S.camp.classes.map(ckey) : [];
  const orphan = p.classes.filter(n => !known.includes(n));
  const rows = peopleRows(), pos = rows.findIndex(r => r[1] === i);
  return `<div class="dh">
      <span class="sdot" style="background:${st.dot};width:11px;height:11px"></span>
      <input data-path="people.${i}.name" value="${esc(p.name)}" placeholder="Имя и фамилия">
      <button class="b-sm" data-act="cardnav" data-d="-1" ${pos <= 0 ? 'disabled' : ''} title="Предыдущий">↑</button>
      <button class="b-sm" data-act="cardnav" data-d="1" ${pos < 0 || pos >= rows.length-1 ? 'disabled' : ''} title="Следующий">↓</button>
      <button class="b-sm" data-act="cardclose" title="Закрыть (Esc)">✕</button>
    </div>
    <div class="db">
      <div class="dsec"><h4>Кто это</h4>
        <div class="seg" style="margin-bottom:9px">${Object.entries(ROLE).map(([k,v]) =>
          `<button data-act="setrole" data-i="${i}" data-v="${k}" aria-pressed="${p.role===k}">${v.l}</button>`).join('')}</div>
        <div class="g2">
          ${fInput(`people.${i}.phone`,'Телефон', p.phone, 'tel')}
          ${fInput(`people.${i}.tg`,'Telegram (без @)', p.tg)}
        </div>
        ${p.tg || p.phone || p.tgId || p.maxId ? `<div class="row" style="margin:-2px 0 9px">
          ${p.tg ? `<a class="chip ro" href="https://t.me/${esc(p.tg)}" target="_blank" rel="noopener">@${esc(p.tg)} ↗</a>` : ''}
          ${p.phone ? `<a class="chip ro" href="tel:${esc(p.phone)}">позвонить ↗</a>` : ''}
          ${p.tgId ? `<span class="chip ro" title="Сам привязал телеграм-бота">🤖 tg ${esc(p.tgId)}</span>` : ''}
          ${p.maxId ? `<span class="chip ro" title="Сам привязал бота в MAX">🤖 max ${esc(p.maxId)}</span>` : ''}</div>` : ''}
        ${fArea(`people.${i}.note`,'Заметка: аллергия, лекарства, с кем едет, особые условия', p.note, 2)}
      </div>

      <div class="dsec"><h4>Регистрация</h4>
        <div class="seg">${Object.entries(STATUS).map(([k,v]) =>
          `<button data-act="setstat" data-i="${i}" data-v="${k}" aria-pressed="${p.status===k}">${v.l}</button>`).join('')}</div>
      </div>

      <div class="dsec"><h4>Заселение</h4>
        ${fInput(`people.${i}.room`,'Номер комнаты', p.room)}
      </div>

      <div class="dsec"><h4>Взносы</h4>
        <div class="money"><b style="color:${debt ? 'var(--warn)' : 'var(--acc)'}">${money(paid)}</b>
          <span class="hint">из ${money(fee)}${debt ? ` · долг ${money(debt)}` : ' · всё внесено'}</span></div>
        <div class="bar"><i style="width:${fee ? Math.min(100, paid/fee*100) : 0}%"></i></div>
        ${p.payments.length ? `<div class="hint" style="display:grid;grid-template-columns:126px 90px 1fr auto;gap:5px;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px">
          <div>Когда</div><div>Сколько</div><div>Чем / комментарий</div><div></div></div>` : ''}
        ${p.payments.map((x,j) => `<div class="pay">
          <input type="date" data-path="people.${i}.payments.${j}.at" value="${esc(x.at)}">
          <input type="number" min="0" step="100" data-path="people.${i}.payments.${j}.sum" value="${Number(x.sum)||0}">
          <input data-path="people.${i}.payments.${j}.note" value="${esc(x.note)}" placeholder="наличные / перевод">
          <button class="b-sm danger" data-act="delpay" data-i="${i}" data-j="${j}">✕</button>
        </div>`).join('')}
        <div class="row" style="margin-top:8px">
          <button class="b-sm" data-act="addpay" data-i="${i}">+ Взнос</button>
          ${debt ? `<button class="b-sm" data-act="addpay" data-i="${i}" data-sum="${debt}">Внести остаток ${money(debt)}</button>` : ''}
        </div>
        ${fInput(`people.${i}.fee`,'Сколько всего должен внести, ₽', fee, 'number', 'min="0" step="100"')}
      </div>

      <div class="dsec"><h4>Мастер-классы</h4>
        ${known.length || orphan.length ? `<div class="chips">
          ${known.map(n => chipHtml(i, n, p.classes.includes(n), false)).join('')}
          ${orphan.map(n => chipHtml(i, n, true, true)).join('')}</div>
          ${orphan.length ? '<p class="hint" style="margin-top:6px">⚠ такого мастер-класса в лендинге нет — снимите галочку или верните название.</p>' : ''}`
        : '<p class="hint">Откройте landing.html — список берётся оттуда.</p>'}
      </div>
    </div>
    <div class="df">
      <button class="b-sm danger" data-act="del" data-list="people" data-i="${i}">Удалить участника</button>
      <span style="flex:1"></span>
      <span class="hint">${pos >= 0 ? `${pos+1} из ${rows.length}` : ''}</span>
      <button class="b-pri" data-act="cardclose">Готово</button>
    </div>`;
}

const sumBy = fn => S.people.filter(active).reduce((a,p) => a + fn(p), 0);

function groups(){
  const byClass = {}, byRoom = {};
  if(S.camp) for(const c of S.camp.classes) byClass[ckey(c)] = [];
  for(const p of S.people){
    if(!active(p)) continue;
    for(const c of p.classes) (byClass[c] = byClass[c] || []).push(p);
    const r = String(p.room).trim() || '— не заселены —';
    (byRoom[r] = byRoom[r] || []).push(p);
  }
  return { byClass, byRoom };
}
function rosterHtml(){
  const { byClass, byRoom } = groups();

/* ── ЗАПИСИ С ТЕЛЕФОНОВ ─────────────────────────────────────────
   signups.json ведёт сервер: участник жмёт «Записаться» в приложении
   лагеря, сервер дописывает строку (см. server.mjs, POST /signup).

   Панель этот файл только ЧИТАЕТ. Иначе сохранение участников затирало
   бы записи, пришедшие с телефонов минуту назад, — а они приходят всё
   время, пока идёт лагерь. Записи попадают в participants.json лишь
   по кнопке «Внести», и уже как обычные мастер-классы участника:
   печать, фильтры и списки работают дальше сами. */
async function loadSigns(quiet){
  /* С базой записи приходят из таблицы signups — и файл, и папка для
     этого не нужны: штаб читает их с любого устройства. */
  if(onDB()){
    try{ S.signs = await CampDB.signups(); }
    catch(err){
      S.signs = S.signs || [];
      if(!quiet) toast('Записи из базы не прочитались: ' + err.message, 'err');
    }
    return;
  }
  /* На сервере папки нет, а записи с телефонов — главное, зачем панель
     открывают с телефона. Читаем их по HTTP: порт панели signups.json
     отдаёт, публичный порт — нет. */
  if(!S.hDir && ONSRV){
    try{
      const r = await fetch('signups.json?t=' + Date.now(), { cache:'no-store' });
      const arr = r.ok ? JSON.parse(await r.text()) : [];
      S.signs = Array.isArray(arr)
        ? arr.filter(x => x && typeof x.cls === 'string' && typeof x.name === 'string') : [];
    }catch(err){ S.signs = S.signs || []; }
    return;
  }
  if(!S.hDir) return;
  try{
    const h = await S.hDir.getFileHandle('signups.json');
    const arr = JSON.parse(await (await h.getFile()).text());
    S.signs = Array.isArray(arr)
      ? arr.filter(r => r && typeof r.cls === 'string' && typeof r.name === 'string') : [];
  }catch(err){
    S.signs = S.signs || [];              // файла нет — просто никто ещё не записался
    if(!quiet) toast('Записей с телефонов пока нет', 'err');
  }
}

/* Регистр и лишние пробелы не должны рождать второго участника. */
const keyName = s => String(s ?? '').trim().toLowerCase().replace(/\s+/g,' ');
/* Телефон в записи (who:'p:…', последние 10 цифр) надёжнее имени: двух
   «Аня Петрова» различает только он. Записи из бота приходят с who:'i:…' —
   там телефона нет и остаётся имя. */
const signPhone = row => /^p:(\d{10})$/.exec(String(row.who || ''))?.[1] || '';
const pKey = v => { const d = digits(v); return d.length >= 10 ? d.slice(-10) : ''; };

/* Один поиск и для галочки «уже внесено», и для кнопки «Внести»: разойдись
   они — на первом однофамильце кнопка врала бы про то, что делает. */
function signPerson(row){
  const ph = signPhone(row);
  if(ph){ const i = S.people.findIndex(p => pKey(p.phone) === ph); if(i >= 0) return i; }
  return S.people.findIndex(p => keyName(p.name) === keyName(row.name));
}
const signTaken = row => { if(!S.people) return false;
  const i = signPerson(row); return i >= 0 && S.people[i].classes.includes(row.cls); };

/* Занято мест в группе — так же, как считает сервер (см. server.mjs, takenOf):
   участники и записи с телефонов объединяются по имени, чтобы один человек
   не занял два места, пока его запись не внесли. */
function takenIn(key){
  const who = new Set();
  (S.people || []).forEach(p => { if(p.classes.includes(key)) who.add(keyName(p.name)); });
  (S.signs  || []).forEach(r => { if(r.cls === key)           who.add(keyName(r.name)); });
  return who.size;
}

function takeSign(row){
  let i = signPerson(row);
  if(i < 0){
    S.people.push({ ...TPL.people(), name:String(row.name).trim(), room:String(row.room ?? '').trim() });
    i = S.people.length - 1;
  }
  const p = S.people[i];
  if(!p.classes.includes(row.cls)) p.classes.push(row.cls);
  if(!String(p.room).trim() && row.room) p.room = String(row.room).trim();
  return i;
}

/* ── импорт из таблицы ─────────────────────────────────────── */
function splitLine(l, d){
  const out = []; let cur = '', q = false;
  for(let i = 0; i < l.length; i++){
    const c = l[i];
    if(q){ if(c === '"'){ if(l[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if(c === '"') q = true;
    else if(c === d){ out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur); return out;
}
const IMP_KEYS = { name:['имя','фио','name','участник','фамилия'], phone:['тел','phone'],
                   tg:['tg','telegram','телеграм','ник','nick'], room:['комн','room','заселен'],
                   note:['примеч','note','коммент','заметк'] };
function parseTable(text){
  const lines = String(text).trim().split(/\r?\n/).filter(l => l.trim());
  if(!lines.length) return [];
  const d = lines[0].includes('\t') ? '\t' : (lines[0].match(/;/g)||[]).length ? ';' : ',';
  let rows = lines.map(l => splitLine(l, d).map(x => x.trim()));
  const h = rows[0].map(x => x.toLowerCase());
  let map;
  if(h.some(x => IMP_KEYS.name.some(k => x.includes(k)))){          // есть строка заголовков — читаем по ней
    map = h.map(x => Object.keys(IMP_KEYS).find(k => IMP_KEYS[k].some(w => x.includes(w))) || null);
    rows = rows.slice(1);
  } else map = ['name','phone','tg','room','note'];                 // иначе — по порядку колонок
  return rows.map(r => {
    const o = { ...PERSON, classes:[], payments:[], fee:defFee() };
    r.forEach((v,i) => { const k = map[i]; if(k) o[k] = v; });
    o.tg = tgClean(o.tg);
    return o;
  }).filter(o => o.name || o.phone || o.tg);
}
function impSplit(){
  const find = r => S.people.find(p =>
    (r.tg && p.tg && p.tg.toLowerCase() === r.tg.toLowerCase()) ||
    (digits(r.phone) && digits(p.phone) === digits(r.phone)));
  const fresh = [], dup = [];
  for(const r of parseTable($('#imp').value)){
    const hit = find(r);
    if(hit) dup.push({ ...r, _hit:hit }); else fresh.push(r);
  }
  return { fresh, dup };
}

  S.people.push(...fresh);
  let changed = 0;
  if(upd) for(const r of dup){                       // непустые поля из таблицы затирают старые
    const p = r._hit;
    ['name','phone','tg','room','note'].forEach(k => { if(String(r[k]).trim()){ p[k] = r[k]; } });
    changed++;
  }
  touched('people'); closeModal(); render();
  toast(`Добавлено: ${fresh.length}${changed ? ` · обновлено: ${changed}` : ''}`);
}

  const fn = A[b.dataset.act];

document.addEventListener('input', e => {
  const t = e.target;
  if(t.id === 'pq')      { S.q = t.value;      return repaintRows(); }
  if(t.id === 'pfilter') { S.filter = t.value; return repaintRows(); }
  if(t.id === 'psort')   { S.sort = t.value;   return repaintRows(); }
  if(t.id === 'pvTime')  { S.pvTime = t.value; return refreshPreview(); }
  if(t.id === 'imp')     { return impPreview(); }
  if(t.id === 'defFee')  { prefs.set('fee', Number(t.value) || 0); return; }
  if(t.id === 'defAuto'){
    S.autosave = t.checked; prefs.set('autosave', S.autosave);
    toast(S.autosave ? 'Автосохранение включено' : 'Автосохранение выключено');
    return scheduleAutosave();
  }
  if(t.dataset.grad){                                    // половинка градиента
    const parts = String(getPath(t.dataset.grad) || ',').split(',');
    parts[+t.dataset.half] = t.value;
    mark(); setPath(t.dataset.grad, parts.join(','));
    const sw = t.parentElement.querySelector('.swatch');
    if(sw) sw.style.background = `linear-gradient(135deg,${parts[0]},${parts[1]})`;
    touched(t.dataset.grad);
    return repaintTiles();
  }
  const p = t.dataset.path;
  if(!p) return;
  mark();
  // вставили письмо BotFather целиком — берём из него только токен
  if(/^integ\.(telegram|max)\.token$/.test(p) && /\s/.test(t.value)){
    const only = grabToken(t.value);
    if(only && only !== t.value){ t.value = only; }
  }
  const v = t.type === 'checkbox' ? t.checked
          : t.type === 'number'   ? Number(t.value)
          : t.type === 'datetime-local' ? t.value.replace('T',' ').slice(0,16)
          : t.value;
  setPath(p, v);
  if(p.endsWith('.arrived')) t.closest('tr').classList.toggle('arr', v);
  if(p === 'year' || p === 'month' || /^days\.\d+\.date$/.test(p)) syncDows();
  if(/^days\.\d+\.events\./.test(p)) repaintEvs();     // время и название сразу видны в списке

  if(t.dataset.act === 'copyday'){
    const i = +t.dataset.i, j = +t.value;

    if(S.camp.days[i].events.length && !confirm('Заменить расписание этого дня целиком?')){ t.value = ''; return; }

    touched('days'); render(); toast('Расписание скопировано');

  const p = t.dataset.path;
  if(p && p.endsWith('.tg')){                            // @user и t.me/user → чистый логин
    const v = tgClean(t.value);
    if(v !== t.value){ t.value = v; setPath(p, v); touched(p); }

document.addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey, k = e.key.toLowerCase();
  if(mod && (k === 's' || k === 'ы')){ e.preventDefault(); return saveAll(); }
  if(mod && (k === 'z' || k === 'я')){ e.preventDefault(); return e.shiftKey ? redo() : undo(); }
  if(e.key === 'Escape'){
    if(!$('#modal').hidden) return closeModal();
    if(S.card != null) return closeCard();
  }
  // стрелки листают то, что открыто, пока курсор не в поле ввода
  if(/^Arrow(Up|Down)$/.test(e.key) && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)){
    const d = e.key === 'ArrowDown' ? 1 : -1;
    if(S.card != null){
      e.preventDefault();
      const rows = peopleRows(), pos = rows.findIndex(r => r[1] === S.card);
      const next = rows[pos + d];
      if(next) openCard(next[1]);
    } else if(S.ev != null){
      e.preventDefault();
      if(S.camp.days[S.day].events[S.ev + d]) openEv(S.ev + d);
    } else if(S.ann != null){
      e.preventDefault();
      const rows = annRows(), pos = rows.findIndex(r => r[1] === S.ann);
      const next = rows[pos + d];
      if(next) openAnn(next[1]);
    } else if(S.tile){
      e.preventDefault();
      if(S.camp[S.tile.list][S.tile.i + d]) openTile(S.tile.list, S.tile.i + d);
    }
  }
});

async function resume(kind){
  const h = (S.remembered || {})[kind];
  if(!h) return;
  try{
    let perm = h.queryPermission ? await h.queryPermission({ mode:'readwrite' }) : 'granted';
    if(perm !== 'granted' && h.requestPermission) perm = await h.requestPermission({ mode:'readwrite' });
    if(perm !== 'granted') return toast('Браузер не дал доступ', 'err');
    if(kind === 'dir') return useFolder(h);
    const f = await h.getFile();
    if(kind === 'camp'){ S.hCamp = h; S.mtC = f.lastModified; S.backed = {}; loadLanding(await f.text(), h.name); }
    else { S.hPeople = h; S.mtP = f.lastModified; loadPeople(await f.text(), h.name); }
  }catch(err){ toast('Не удалось открыть: ' + err.message, 'err'); }
}
/* Открыли панель по http (локальный сервер) — соседние файлы можно
   прочитать без диалога. Права на ЗАПИСЬ это не даёт: сохранение
   по-прежнему спросит, куда писать. На file:// fetch запрещён — там
   остаётся обычное открытие файла. */
/* ── ЗАГРУЗКА ИЗ ЕДИНОЙ БАЗЫ ────────────────────────────────────
   Ни файлов, ни папки: штаб открывается с любого устройства и сразу
   видит то же, что стойка. Разметку лендинга всё же подтягиваем, если
   она рядом — без неё нечего перегенерировать для выкладки в GitHub. */
async function autoLoadDB(){
  try{
    const c = await CampDB.camp();
    if(c && c.camp){
      /* Разметка нужна только для файла. Нет её — держим пустую:
         injectCamp тогда просто не найдёт куда вклеить, и сохранение
         уйдёт в базу, чего для телефонов достаточно. */
      /* Разметка нужна не только для файла: из неё разбираются цвета
         метк, типы событий, набор значков и правила проверки — словарь
         редактора. Панель, открытая через сервер (в том числе с планшета
         по /admin/), получает её обычным fetch. Совсем без разметки
         редактировать расписание можно, но метки и значки будут пустыми. */
      let html = '';
      if(/^https?:$/.test(location.protocol))
        try{ const r = await fetch('landing.html', { cache:'no-store' });
             if(r.ok) html = await r.text(); }catch(_){}
      if(html) loadLanding(html, 'landing.html');
      else toast('Разметка лендинга недоступна — метки и значки будут пустыми', 'err');
      S.camp = c.camp;                     // из базы, а не из файла: она источник правды
      S.dirty = false;
    }
  }catch(err){ toast('Расписание из базы не прочиталось: ' + err.message, 'err'); }

  if(can('people')) try{
    const rows = await CampDB.people();
    loadPeople(JSON.stringify(rows), 'база');
  }catch(err){ toast('Участники из базы не прочитались: ' + err.message, 'err'); }

  await loadInteg();
  try{ await loadSigns(true); }catch(_){}

  S.view = can('dash') ? 'dash' : S.view;
  render();
  toast('Единая база подключена');
  return true;
}

async function autoLoad(){
  if(onDB()) return autoLoadDB();
  if(!/^https?:$/.test(location.protocol)) return false;
  let loaded = false;
  try{
    const r = await fetch('landing.html', { cache:'no-store' });
    if(r.ok){ loadLanding(await r.text(), 'landing.html'); loaded = true; }
  }catch(_){}
  /* Роли без раздела «Участники» файл с персональными данными не читаем
     вообще — спрятанный в интерфейсе список всё равно лежал бы в памяти. */
  if(can('people')) try{
    const r = await fetch('participants.json', { cache:'no-store' });
    if(r.ok){ const t = (await r.text()).trim(); if(t) loadPeople(t, 'participants.json'); }
  }catch(_){}
  if(loaded){
    S.view = 'dash'; render();
    toast('Файлы рядом с панелью открыты автоматически');
  }
  return loaded;
}

     capTag(S.camp.classes[0]).includes('>1 / 2<') && capTag(S.camp.classes[1]).includes('>1<'));
  S.people[0].classes = wasCls;
  S.camp.classes = [{ name:'Музыка', day:'', cap:0, grad:'#1,#2', icon:'globe', txt:'', when:'', where:'', who:'' }];

  /* ── объявления: порядок как на странице, закрепление, метки ── */
  S.camp.announcements = [
    { at:'2026-08-25 12:00', pin:false, tag:'',       title:'Старое',   text:'т' },
    { at:'2026-08-25 18:00', pin:false, tag:'важно',  title:'Свежее',   text:'т' },
    { at:'2026-08-25 09:00', pin:true,  tag:'',       title:'Важное',   text:'т' },
  ];
  ok('порядок как на странице: закреплённые, потом свежие',
     annRows().map(r => r[0].title).join() === 'Важное,Свежее,Старое');
  A.pin({ dataset:{ i:'1' } });
  ok('закрепление меняет порядок', annRows()[0][0].title === 'Свежее' && S.camp.announcements[1].pin === true);
  A.pin({ dataset:{ i:'1' } });
  A.settag({ dataset:{ i:'0', v:'важно' } });
  ok('метка ставится', S.camp.announcements[0].tag === 'важно');
  A.annnow({ dataset:{ i:'0' } });
  ok('«сейчас» ставит текущее время', /^\d{4}-\d\d-\d\d \d\d:\d\d$/.test(S.camp.announcements[0].at)
     // сравниваем с часами, а не с подписью: «только что» превращается в «1 минуту назад»
     // на 30-й секунде, и проверка падала бы в половине запусков
     && Math.abs(Date.now() - new Date(S.camp.announcements[0].at.replace(' ','T'))) < 61000);
  S.camp.announcements[0].at = '2099-01-01 10:00';
  ok('будущее время читается как «скоро»', agoText(S.camp.announcements[0].at) === 'скоро');
  openAnn(2);
  ok('карточка объявления открывается', S.ann === 2 && $('#card').innerHTML.includes('Важное'));
  A.dupann({ dataset:{ i:'2' } });
  ok('дублирование создаёт копию со свежим временем',
     S.camp.announcements.length === 4 && S.camp.announcements[3].title === 'Важное'
     && S.camp.announcements[3].at !== S.camp.announcements[2].at);
  S.camp.announcements.pop(); closeCard();
  ok('панель объявления закрывается', $('#card').hidden && S.ann === null);
  S.camp.announcements = [{ at:'2026-08-25 12:00', pin:true, tag:'важно', title:'Заезд', text:'до 15:30' }];

  /* ── расписание: тайминг, карточка события, перенос ── */
  S.day = 0;
  const D0 = S.camp.days[0];
  D0.events = [{ t:'09:00', e:'10:00', ev:'Завтрак', type:'m' },
               { t:'10:30', e:'11:00', ev:'Сбор',    type:'h' },
               { t:'23:00', e:'00:30', ev:'Костёр',  type:'h' }];
  ok('длительность и перерыв', (() => { const a = evTiming(D0.events,0);
    return a.dur === 60 && a.gap === 30 && !a.over; })());
  ok('пересечение находится', (() => { D0.events[1].e = '11:30'; D0.events[2].t = '11:00';
    const a = evTiming(D0.events,1); D0.events[1].e = '11:00'; D0.events[2].t = '23:00';
    return a.over && a.gap === 30; })());
  ok('переход через полночь считается', evTiming(D0.events,2).dur === 90);
  openEv(1);
  ok('карточка события открывается', S.ev === 1 && S.card === null && $('#card').innerHTML.includes('Сбор'));
  A.settype({ dataset:{ j:'1', v:'m' } });
  ok('тип меняется сегментом', D0.events[1].type === 'm');
  A.addev({ dataset:{ i:'0' } });
  ok('новое событие продолжает предыдущее', D0.events.at(-1).t === '00:30' && S.ev === D0.events.length - 1);
  D0.events.pop();
  S.camp.days.push({ date:26, dow:dowOf(26), theme:'Второй', tagline:'', events:[] });
  openEv(2);
  A.moveev({ dataset:{ j:'2', to:'1' } });
  ok('перенос события в другой день', S.camp.days[1].events.length === 1
     && S.camp.days[1].events[0].ev === 'Костёр' && S.camp.days[0].events.length === 2 && S.day === 1);
  S.camp.days.pop(); S.day = 0; closeCard();
  ok('панель события закрывается', $('#card').hidden && S.ev === null);

  /* ── карточка участника ── */
  openCard(1);
  ok('карточка открывается', !$('#card').hidden && $('#card').innerHTML.includes('Взносы'));
  A.addpay({ dataset:{ i:'1', sum:String(debtOf(S.people[1])) } });
  ok('«внести остаток» гасит долг', debtOf(S.people[1]) === 0 && S.people[1].payments.length === 2);
  A.delpay({ dataset:{ i:'1', j:'1' } });
  ok('взнос удаляется', debtOf(S.people[1]) === 5000 && S.people[1].payments.length === 1);
  A.quickstat({ dataset:{ i:'1' } });
  ok('✓ в строке ставит «Заехал»', S.people[1].status === 'arrived');
  A.quickstat({ dataset:{ i:'1' } });
  ok('повторное ✓ откатывает в «Подтверждён»', S.people[1].status === 'confirmed');
  S.people.push(TPL.people());
  const last = S.people.length - 1;
  A.setrole({ dataset:{ i:String(last), v:'team' } });
  ok('роль «команда» обнуляет взнос новичку', S.people[last].role === 'team' && S.people[last].fee === 0);
  S.people.pop(); closeCard();
  ok('карточка закрывается', $('#card').hidden && S.card === null);
  const iss = issues().map(x => x.txt).join(' | ');
  ok('находит осиротевшую запись', iss.includes('«Гончарка»'));
  ok('находит долг и отсутствие связи', iss.includes('С долгом: 1') && iss.includes('Без связи'));
  S.people[1].status = 'cancelled';
  ok('отказавшийся не числится должником', !issues().map(x => x.txt).join(' ').includes('С долгом') && sumBy(debtOf) === 0);
  S.people[1].status = 'new';
  ok('сводка считает по группам', rosterHtml().includes('Музыка'));

  const imp = parseTable('Имя\tТелефон\tTelegram\tКомната\nВера\t+79001234567\t@vera\t5\nГлеб\t89990001122\thttps://t.me/gleb\t5');
  ok('импорт с заголовками', imp.length === 2 && imp[0].name === 'Вера' && imp[0].tg === 'vera' && imp[1].tg === 'gleb');
  ok('импорт без заголовков и с ;', parseTable('Дима;+7 000;dima;9')[0].room === '9');
  ok('импорт с кавычками', parseTable('"Ким, Анна";+7;kim;1')[0].name === 'Ким, Анна');

  H.past.length = 0; H.future.length = 0;
  mark(true); S.camp.place = 'Испорчено'; undo();
  ok('отмена возвращает данные', S.camp.place.includes('место'));
  redo(); ok('возврат работает', S.camp.place === 'Испорчено');


  /* ── доступ: роли и инвариант «главный есть» ────────────────
     Паролей здесь больше нет — их держит Supabase Auth. Осталось то,
     что панель решает сама: кто какие разделы видит и не осталось ли
     штаба без главного. Настоящую защиту от последнего случая держит
     триггер в базе, проверка на него — в supabase/schema.test.sql. */
  const mkStaff = (login, name, role) =>
    ({ user_id:'uuid-' + login, login, name, role, off:false });
  const byLogin = l => (S.users || []).find(u => u.login === l);
  S.users = [mkStaff('anna@camp','Анна','admin'), mkStaff('oleg@camp','Олег','desk')];

  ok('в списке доступа нет ни паролей, ни хэшей',
     !/pass|hash|salt/i.test(JSON.stringify(S.users)));

  S.me = byLogin('anna@camp');
  ok('главный видит все разделы', NAV.every(n => can(n[0])));
  S.me = byLogin('oleg@camp');
  ok('регистратура видит участников', can('people') && can('rosters'));
  ok('регистратура не видит расписание и доступ', !can('sched') && !can('access'));
  ok('меню роли короче полного', navFor().length < NAV.length && navFor().every(n => can(n[0])));
  S.view = 'sched'; render();
  ok('запрещённый раздел не открывается', S.view !== 'sched' && can(S.view));
  A.view({ dataset:{ view:'access' } });
  ok('прямой переход в чужой раздел отбит', S.view !== 'access');

  S.me = byLogin('anna@camp');
  ok('роль главного меняется только пока есть второй главный',
     !guardAdmin(() => { S.users[0].role = 'desk'; }) && S.users[0].role === 'admin');
  ok('последнего главного не отключить',
     !guardAdmin(() => { S.users[0].off = true; }) && S.users[0].off === false);
  ok('последнего главного не удалить',
     !guardAdmin(() => { S.users = S.users.filter(x => x.login !== 'anna@camp'); })
     && S.users.length === 2);
  ok('второго главного назначить можно',
     guardAdmin(() => { S.users[1].role = 'admin'; }) && admins(S.users).length === 2);
  ok('теперь разжаловать себя разрешено',
     guardAdmin(() => { S.users[0].role = 'desk'; }) && admins(S.users).length === 1);

  /* ── запись на диск: конфликт и бэкап (на подставных хэндлах) ── */
  const fakeFile = (name,text) => { let c = text, mt = 1000;
    return { kind:'file', name,
      getFile: async () => ({ name, lastModified:mt, text: async () => c }),
      createWritable: async () => ({ write: async t => { c = t; }, close: async () => { mt += 1000; } }),
      _set:(t,m) => { c = t; if(m) mt = m; }, _get:() => c }; };
  const fakeDir = (name,files) => { const subs = {};
    return { kind:'directory', name, _files:files, _subs:subs,
      entries: async function*(){ for(const k of Object.keys(files)) yield [k, files[k]]; },
      getFileHandle: async (n,o) => { if(!files[n]){ if(!o || !o.create) throw new Error('нет ' + n); files[n] = fakeFile(n,''); } return files[n]; },
      getDirectoryHandle: async n => { if(!subs[n]) subs[n] = fakeDir(n,{}); return subs[n]; },
      removeEntry: async n => { delete files[n]; } }; };

  const realAsk = ask, realIdb = idb.set;
  let answer = 'ok';
  ask = async () => answer;                       // диалоги отвечают по сценарию
  idb.set = async () => {};
  const dir = fakeDir('camp', { 'landing.html':fakeFile('landing.html', SAMPLE),
                                'participants.json':fakeFile('participants.json','[]'),
                                'signups.json':fakeFile('signups.json',
                                  '[{"id":"ab12cd34","name":"Женя","room":"5","cls":"Музыка","at":"2026-08-26 14:00"}]') });
  await useFolder(dir);
  ok('папка: подхвачены оба файла', S.name === 'landing.html' && Array.isArray(S.people) && !!S.hDir);
  ok('записи с телефонов прочитаны и за участников не приняты',
     S.signs.length === 1 && S.signs[0].cls === 'Музыка'
     && S.people.length === 0 && S.pName === 'participants.json');

  S.camp.place = 'Правка 1'; S.dirty = true;
  await saveAll();
  ok('запись в файл', dir._files['landing.html']._get().includes('Правка 1'));
  const bnames = Object.keys(dir._subs.backups._files);
  ok('бэкап содержит версию ДО правки',
     bnames.length === 1 && !dir._subs.backups._files[bnames[0]]._get().includes('Правка 1'));

  dir._files['landing.html']._set(SAMPLE.replace("place:'Тест'","place:'С ДИСКА'"), 9e12);
  S.camp.place = 'Правка 2'; S.dirty = true;
  answer = 'cancel'; await saveAll();
  ok('конфликт: «отмена» ничего не пишет', dir._files['landing.html']._get().includes('С ДИСКА'));
  answer = 'reload'; await saveAll();
  ok('конфликт: «перечитать» берёт версию с диска', S.camp.place === 'С ДИСКА' && S.dirty === false);
  dir._files['landing.html']._set(SAMPLE.replace("place:'Тест'","place:'ЕЩЁ РАЗ'"), 9e13);
  S.camp.place = 'Правка 3'; S.dirty = true;
  await saveAll(true);
  ok('автосохранение не затирает чужие правки',
     dir._files['landing.html']._get().includes('ЕЩЁ РАЗ') && S.dirty === true);
  answer = 'ok'; await saveAll();
  ok('конфликт: «перезаписать» пишет своё', dir._files['landing.html']._get().includes('Правка 3'));
  ok('бэкап за сессию один', Object.keys(dir._subs.backups._files).length === 1);

  /* Файла доступа больше нет — и появиться он не должен: пароли живут
     в Supabase, а не в папке лагеря. */
  ok('users.json панель больше не создаёт', !dir._files['users.json']);

  /* главный инвариант раздела: панель пишет участников, но не записи */
  takeSign(S.signs[0]); S.pDirty = true; answer = 'ok';
  await saveAll();
  ok('сохранение участников не трогает signups.json',
     JSON.parse(dir._files['signups.json']._get()).length === 1
     && JSON.parse(dir._files['participants.json']._get())[0].classes.join() === 'Музыка');

  ask = realAsk; idb.set = realIdb;
  ok('персональные данные не попадают в лендинг', !injectCamp(S.html, S.camp).includes('anya'));
  show();
})(); } else {
  boot();
}
</script>
